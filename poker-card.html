<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手元カード</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0e13;color:#e6edf3;
    font-family:-apple-system,"Segoe UI","Yu Gothic UI",sans-serif;
    padding:14px;font-size:15px;line-height:1.5}
  .card{max-width:400px;margin:0 auto}
  h1{font-size:13px;color:#6e7d8d;font-weight:600;letter-spacing:.1em;margin-bottom:12px}
  .rule{background:#161b22;border:1px solid #2a323d;border-radius:12px;
    padding:14px 16px;margin-bottom:10px;border-left:5px solid #a371f7}
  .rule .n{font-size:11px;color:#a371f7;font-weight:800;letter-spacing:.12em}
  .rule .t{font-size:19px;font-weight:700;margin-top:3px;line-height:1.35}
  .rule .s{font-size:13px;color:#9aa7b4;margin-top:7px}
  .sizes{display:flex;gap:8px;margin-top:10px}
  .sz{flex:1;background:#0e1319;border:1px solid #2a323d;border-radius:8px;
    padding:9px 10px;text-align:center}
  .sz .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .sz .k{font-size:11px;color:#9aa7b4;margin-top:2px}
  .a{color:#3fb950} .b{color:#58a15f}
  .foot{margin-top:16px;padding:12px 14px;background:#12171e;border-radius:10px;
    font-size:13px;color:#9aa7b4;border:1px solid #232a34}
  .foot b{color:#e6edf3}
  .off{margin-top:12px;font-size:12.5px;color:#5b6876;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>プレイ中に見るのはこれだけ</h1>

  <div class="rule">
    <div class="n">RULE 1 ─ サイズ</div>
    <div class="t">打つなら 1/3。<br>2ペア以上のときだけ 2/3。</div>
    <div class="sizes">
      <div class="sz"><div class="v a">1/3</div><div class="k">それ以外ぜんぶ</div></div>
      <div class="sz"><div class="v b">2/3</div><div class="k">2ペア以上</div></div>
    </div>
    <div class="s">サイズで悩まない。2択しかない。</div>
  </div>

  <div class="rule">
    <div class="n">RULE 2 ─ レイズされたら</div>
    <div class="t">自分が打って<br>レイズされたら降りる。</div>
    <div class="s">2ペア以上のときだけ続ける。考えずに降りていい。</div>
  </div>

  <div class="foot">
    <b>この2つ以外は今は考えなくていい。</b><br>
    レンジも、相手のタイプも、頻度も、全部あとで一緒にやる。
    プレイ中の君の仕事は「2択のサイズを選ぶ」ことと「レイズされたら降りる」ことだけ。
  </div>

  <div class="off">迷ったらチェック。それで損はしない。</div>
</div>
</body>
</html>
